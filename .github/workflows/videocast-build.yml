name: Build VideoCast APK
on:
  push:
    branches:
      - build/videocast-lg-chromecast-v0-2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android Platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: unzip -q videocast-src.zip
      - name: Unit tests and debug APK
        working-directory: LGEmbeddedCast
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK exists
        run: test -s LGEmbeddedCast/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCast-LG-Chromecast-v0.2-debug-APK
          path: LGEmbeddedCast/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
