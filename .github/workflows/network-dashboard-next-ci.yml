name: Network Dashboard Next CI

on:
  push:
    branches:
      - agent/network-dashboard-rebuild
    paths:
      - "network-dashboard-next/**"
      - ".github/workflows/network-dashboard-next-ci.yml"
  pull_request:
    paths:
      - "network-dashboard-next/**"
      - ".github/workflows/network-dashboard-next-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network-dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: network-dashboard-next/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Compile
        run: python -m compileall -q app tests run.py
      - name: Tests
        run: pytest
